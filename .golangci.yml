run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
    - gocritic

linters-settings:
  goimports:
    local-prefixes: github.com/FrancoPersonal/golang-api-rest-aws

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck

repos:
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint + lint badge update
        language: system
        entry: bash scripts/update_lint_badge.sh
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      - id: coverage-check
        name: coverage check (≥80%) + badge update
        language: system
        entry: bash scripts/check_coverage.sh
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, test, refactor, docs, ci, build, perf, revert]

services:
  floci:
    image: floci/floci:latest-compat
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      - FLOCI_DEFAULT_REGION=us-east-1
      - FLOCI_STORAGE_MODE=hybrid
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/floci:/app/data
      - ./build:/build

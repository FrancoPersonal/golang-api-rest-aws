version: "3"

vars:
  BINARY: bootstrap
  MODULE: github.com/FrancoPersonal/golang-api-rest-aws
  COVERAGE_THRESHOLD: "80"

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run unit tests with race detector
    cmds:
      - go test -race -count=1 ./...

  coverage:
    desc: Run tests, enforce ≥80% coverage and update README badge
    cmds:
      - bash scripts/check_coverage.sh

  build:
    desc: Cross-compile Lambda binary (linux/amd64 → ./bootstrap)
    cmds:
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o {{.BINARY}} ./cmd/lambda

  local:api:
    desc: Start the API locally via Serverless Framework (requires Docker)
    deps: [build]
    cmds:
      - serverless offline start --stage dev

  deploy:guided:
    desc: Interactive first-time Serverless Framework deploy
    deps: [build]
    cmds:
      - serverless print --stage dev
      - serverless deploy --stage dev

  deploy:
    desc: Deploy using Serverless Framework default stage
    deps: [build]
    cmds:
      - serverless deploy

  deploy:dev:
    desc: Deploy to dev stack
    deps: [build]
    cmds:
      - serverless deploy --stage dev

  deploy:prod:
    desc: Deploy to prod stack
    deps: [build]
    cmds:
      - serverless deploy --stage prod

  pre-commit:
    desc: Run all pre-commit checks (lint + coverage) and update badges
    cmds:
      - task: badge:lint
      - task: badge:coverage

  badge:lint:
    desc: Run golangci-lint and update the lint badge in README.md
    cmds:
      - bash scripts/update_lint_badge.sh

  badge:coverage:
    desc: Run tests and update the coverage badge in README.md
    cmds:
      - bash scripts/check_coverage.sh

  badge:
    desc: Update both lint and coverage badges in README.md
    cmds:
      - task: badge:lint
      - task: badge:coverage

  tidy:
    desc: Tidy and verify Go modules
    cmds:
      - go env -w GOPRIVATE=github.com/FrancoPersonal/*
      - go env -w GONOSUMDB=github.com/FrancoPersonal/*
      - go mod download
      - go mod tidy
      - go mod verify

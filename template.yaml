AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Cauciones REST API — Lambda + HTTP API Gateway v2 + DynamoDB

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        CAUCION_TABLE_NAME: !Ref CaucionesTable
        LOG_LEVEL: !Ref LogLevel

Parameters:
  LogLevel:
    Type: String
    Default: info
    AllowedValues: [debug, info, warn, error]
    Description: Log verbosity level for the Lambda function

Resources:
  CaucionesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CaucionesTable
      Events:
        CreateCaucion:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaucionesApi
            Path: /cauciones
            Method: POST
        ListCauciones:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaucionesApi
            Path: /cauciones
            Method: GET
        GetCaucion:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaucionesApi
            Path: /cauciones/{id}
            Method: GET
        UpdateCaucion:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaucionesApi
            Path: /cauciones/{id}
            Method: PUT
        DeleteCaucion:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaucionesApi
            Path: /cauciones/{id}
            Method: DELETE
        ChangeStateCaucion:
          Type: HttpApi
          Properties:
            ApiId: !Ref CaucionesApi
            Path: /cauciones/{id}/estado
            Method: PATCH
    Metadata:
      BuildMethod: makefile

  CaucionesApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref AWS::StackName
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300

  CaucionesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway v2 endpoint URL
    Value: !Sub "https://${CaucionesApi}.execute-api.${AWS::Region}.amazonaws.com/${AWS::StackName}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"

  TableName:
    Description: DynamoDB table name
    Value: !Ref CaucionesTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt CaucionesFunction.Arn
